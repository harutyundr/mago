name: Publish

# Builds release binaries for all supported targets on native runners,
# attaches them to a GitHub release, and publishes the multi-arch Linux
# image to the devbox GitLab registry. See PUBLISHING.md for the flow.
#
# Triggers:
#   - pushing a `v*` tag (scripts/update-upstream.sh --tag creates one)
#   - manual dispatch from the Actions tab

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY_IMAGE: registry.gitlab.com/xenreact/devbox/devbox/mago

permissions:
  contents: write

jobs:
  meta:
    name: extract version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract version
        id: meta
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-x86_64
          cache-on-failure: true
      - name: run tests
        run: cargo test --workspace --locked --all-targets

  build:
    name: ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries, also shipped in the docker image
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          # macOS binaries for hosts that run mago directly
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Windows binary, release asset only
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGING="$(mktemp -d)/mago-${VERSION}-${TARGET}"
          mkdir -p "${STAGING}"
          cp "target/${TARGET}/release/mago" "${STAGING}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGING}/"
          tar czf "mago-${VERSION}-${TARGET}.tar.gz" -C "$(dirname "${STAGING}")" "$(basename "${STAGING}")"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.meta.outputs.version }}"
          $TARGET = "${{ matrix.target }}"
          $staging = "mago-$VERSION-$TARGET"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/$TARGET/release/mago.exe" $staging
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $staging
          Compress-Archive -Path $staging -DestinationPath "mago-$VERSION-$TARGET.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mago-${{ needs.meta.outputs.version }}-${{ matrix.target }}
          path: |
            mago-${{ needs.meta.outputs.version }}-*.tar.gz
            mago-${{ needs.meta.outputs.version }}-*.zip
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: [meta, build, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    name: build and push container image
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: mago-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-musl
          path: /tmp/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: mago-${{ needs.meta.outputs.version }}-aarch64-unknown-linux-musl
          path: /tmp/aarch64

      - name: extract binaries
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          tar xzf /tmp/x86_64/mago-${VERSION}-x86_64-unknown-linux-musl.tar.gz -C /tmp/x86_64 --strip-components=1
          tar xzf /tmp/aarch64/mago-${VERSION}-aarch64-unknown-linux-musl.tar.gz -C /tmp/aarch64 --strip-components=1
          chmod +x /tmp/x86_64/mago /tmp/aarch64/mago

      - name: build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: /tmp/x86_64
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.meta.outputs.tag }}-amd64

      - name: build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: /tmp/aarch64
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.meta.outputs.tag }}-arm64

      - name: create multi-arch manifest
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${{ needs.meta.outputs.version }}"
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:latest \
            --tag ${{ env.REGISTRY_IMAGE }}:${VERSION} \
            --tag ${{ env.REGISTRY_IMAGE }}:${TAG} \
            ${{ env.REGISTRY_IMAGE }}:${TAG}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${TAG}-arm64
